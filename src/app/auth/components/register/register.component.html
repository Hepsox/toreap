<div class="auth">
  <div class="auth__header">
    <img src="assets/logo.png" alt="Logo" class="auth__logo" />
  </div>

  <form class="auth__form">
    <div class="auth__intro">
      <h2 class="auth__title">Créer un compte</h2>
      <p class="auth__description">Remplissez les champs pour vous inscrire</p>
    </div>

    <div class="auth__group">
      <label for="lastname" class="auth__label">Nom</label>
      <input
        type="text"
        id="lastname"
        class="auth__input"
        placeholder="Entrez votre nom"
        required
      />
    </div>

    <div class="auth__group">
      <label for="firstname" class="auth__label">Prénom</label>
      <input
        type="text"
        id="firstname"
        class="auth__input"
        placeholder="Entrez votre prénom"
        required
      />
    </div>

    <div class="auth__group">
      <label for="phone" class="auth__label">Téléphone</label>
      <input
        type="tel"
        id="phone"
        class="auth__input"
        placeholder="Entrez votre numéro de téléphone"
        required
      />
    </div>

    <div class="auth__group">
      <label for="email" class="auth__label">Email</label>
      <input
        type="email"
        id="email"
        class="auth__input"
        placeholder="Entrez votre email"
        required
      />
    </div>

    <div class="auth__group">
      <label for="password" class="auth__label">Mot de passe</label>
      <input
        type="password"
        id="password"
        class="auth__input"
        placeholder="Entrez votre mot de passe"
        required
      />
    </div>

    <div class="auth__group">
      <label for="confirm-password" class="auth__label"
        >Confirmer le mot de passe</label
      >
      <input
        type="password"
        id="confirm-password"
        class="auth__input"
        placeholder="Confirmez votre mot de passe"
        required
      />
    </div>

    <button type="submit" class="auth__button">S'inscrire</button>
  </form>

  <div class="auth__footer">
    <p class="auth__footer-text">
      Vous avez déjà un compte ?
      <a href="#" class="auth__link">Connectez-vous</a>
    </p>
  </div>
</div>
