<div class="auth">
  <div class="auth__header">
    <img src="assets/logo.png" alt="Logo" class="auth__logo" />
  </div>

  <form class="auth__form">
    <div class="auth__intro">
      <h2 class="auth__title">Se connecter</h2>
      <p class="auth__description">
        Veuillez entrer vos informations de connexion
      </p>
    </div>

    <div class="auth__group">
      <label for="email" class="auth__label">Email</label>
      <input
        type="email"
        id="email"
        class="auth__input"
        placeholder="Entrez votre email"
        required
      />
    </div>

    <div class="auth__group">
      <label for="password" class="auth__label">Mot de passe</label>
      <input
        type="password"
        id="password"
        class="auth__input"
        placeholder="Entrez votre mot de passe"
        required
      />
    </div>

    <div class="auth__forgot">
      <a href="#" class="auth__link">Mot de passe oublié ?</a>
    </div>

    <button type="submit" class="auth__button">Se connecter</button>
  </form>

  <div class="auth__footer">
    <p class="auth__footer-text">
      Pas encore de compte ?
      <a href="#" class="auth__link">Inscrivez-vous</a>
    </p>
  </div>
</div>
